<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Bosuk Nam — Backend Developer</title>
<meta name="description" content="남보석 · Backend Developer (Java/Spring). 카카오 인프라개발팀. 1990년부터 2026년까지 연도별 방을 직접 걸어서 지나가는 3D 포트폴리오.">
<meta property="og:title" content="Bosuk Nam — Backend Developer">
<meta property="og:description" content="Java/Spring 백엔드 개발자 남보석의 포트폴리오. 1인칭으로 연대기 방을 걸어 보세요.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%2314213d'/><rect x='4' y='2' width='8' height='4' fill='%232b2b2b'/><rect x='4' y='6' width='8' height='4' fill='%23f2c9a0'/><rect x='3' y='10' width='10' height='5' fill='%232456c4'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=VT323&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<link rel="stylesheet" href="walk.css?v=1">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
} }
</script>
</head>
<body>

<div id="world"></div>

<!-- 고정 상단: 이름 · 소개 · 버전 선택 · 네비 -->
<header id="top">
  <div class="brand">
    <b id="brand-name">남보석</b>
    <span id="brand-sub">Backend Developer · Java / Spring · Kakao 인프라개발팀 2022 –</span>
  </div>
  <div class="right">
    <label class="ver"><span id="ver-label">버전</span>
      <select id="ver">
        <option value="walk" selected>3D 워크 (1인칭)</option>
        <option value="pixel">2D 픽셀 (이전 버전)</option>
      </select>
    </label>
    <nav id="nav">
      <button data-card="about">소개</button>
      <button data-card="career">경력</button>
      <button data-card="skills">스킬</button>
      <button data-card="contact">연락처</button>
    </nav>
  </div>
</header>

<!-- HUD -->
<div id="hud">
  <div class="hud-l">
    <span class="box"><span id="hud-stage-k">STAGE</span> <b id="hud-stage">1</b>/<span id="hud-stage-n">10</span> · <b id="hud-year">1990</b></span>
    <span class="box">⚡ <b id="hud-skills">0</b>/<span id="hud-skills-n">18</span></span>
    <span class="box">🏆 <b id="hud-ach">0</b>/<span id="hud-ach-n">7</span></span>
    <span class="box" id="hud-servers-box" hidden>💤 <b id="hud-servers">0</b></span>
  </div>
  <div class="hud-r">
    <button class="hbtn" id="btn-auto">🚶 자동 투어</button>
    <button class="hbtn" id="btn-sound">🔇</button>
    <button class="hbtn" id="btn-lang">EN</button>
    <button class="hbtn" id="btn-reset" title="reset">↺</button>
  </div>
  <div id="progress"><div id="progress-bar"></div><div id="progress-marks"></div></div>
</div>

<!-- 조준점 / 상호작용 프롬프트 -->
<div id="reticle"></div>
<div id="prompt" hidden><kbd>E</kbd> <span id="prompt-text"></span></div>
<div id="objective"></div>

<!-- 시작 화면 -->
<div id="title" class="overlay">
  <div class="title-card">
    <div class="t-year">1990 → 2026</div>
    <div class="t-name" id="title-name">남보석</div>
    <div class="t-sub" id="title-sub">Backend Developer · Java / Spring</div>
    <p class="t-desc" id="title-desc">연도별로 이어진 10개의 방을 직접 걸어서 지나갑니다. 방마다 <b>카드</b>를 읽고 떠 있는 <b>스킬 칩</b>을 모으면 다음 방 문이 열립니다.</p>
    <div class="t-controls" id="title-controls">
      <span><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span><span>마우스 시점</span><span><kbd>E</kbd> / 클릭 상호작용</span><span><kbd>Esc</kbd> 마우스 해제</span>
    </div>
    <div class="t-btns">
      <button class="pbtn primary" id="btn-start">▶ 시작</button>
      <button class="pbtn" id="btn-continue" hidden>이어하기</button>
      <button class="pbtn" id="btn-tour">🚶 자동 투어</button>
      <a class="pbtn" id="btn-pdf" href="portfolio_ko.pdf" download>📄 PDF</a>
    </div>
    <div class="t-foot"><a href="game.html" id="btn-pixel">🕹 2D 픽셀 버전(이전 버전)으로 보기</a> · <button class="lnk" id="btn-lang2">English</button></div>
  </div>
</div>

<!-- 모바일 컨트롤 -->
<div id="touch" hidden>
  <div id="joy"><div id="joy-knob"></div></div>
  <button id="btn-e">E</button>
</div>

<!-- 로딩 -->
<div id="loading"><div class="crt-text">LOADING WORLD<span class="dots"></span></div></div>

<!-- 카드 -->
<div id="modal" hidden>
  <div class="card" role="dialog" aria-modal="true">
    <button class="x" id="modal-x" aria-label="close">✕</button>
    <div id="modal-body"></div>
    <div class="card-foot"><button class="pbtn primary" id="modal-ok">확인 (Esc)</button></div>
  </div>
</div>

<div id="toast"></div>

<noscript>
  <div style="padding:24px;font-family:sans-serif;color:#fff">
    <h1>남보석 · Backend Developer</h1>
    <p>이 페이지는 JavaScript가 필요합니다. <a href="game.html" style="color:#fc0">픽셀 버전</a> · PDF: <a href="portfolio_ko.pdf" style="color:#fc0">국문</a> · <a href="portfolio_en.pdf" style="color:#fc0">English</a></p>
  </div>
</noscript>

<script src="data.js?v=1"></script>
<script type="module" src="walk.js?v=1"></script>
</body>
</html>
